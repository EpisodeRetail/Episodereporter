document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');

    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

ct{font-family:inherit;color:inherit}\ninput::placeholder,textarea::placeholder{color:#8A8A8A}\n*{-webkit-tap-highlight-color:transparent}\n.noscroll::-webkit-scrollbar{display:none}\n.ph{background-image:repeating-linear-gradient(135deg,rgba(0,0,0,.055) 0 6px,transparent 6px 12px);display:flex;align-items:center;justify-content:center;font:400 9px ui-monospace,Menlo,monospace;color:#6B6B6B;letter-spacing:.04em;text-transform:uppercase}\n.print-sheet{display:none}\n@media print{\n  .print-sheet,.print-sheet *{print-color-adjust:exact;-webkit-print-color-adjust:exact}\n  @page{margin:15mm 14mm 16mm}\n  .print-sheet{font-family:Aptos,\"Segoe UI\",Helvetica,Arial,sans-serif;color:#1A1A1A}\n  .print-sheet img{max-width:100%}\n  html,body{background:#fff}\n  .app-chrome{display:none !important}\n  .print-sheet{display:block !important}\n}\n<\u002Fstyle><script>\n(function(){\n  function add(tag,props){var e=document.createElement(tag);for(var k in props)e.setAttribute(k,props[k]);document.head.appendChild(e);}\n  if(!document.querySelector('link[rel=manifest]')){\n    add('link',{rel:'manifest',href:'manifest.webmanifest'});\n    add('meta',{name:'theme-color',content:'#1A1A1A'});\n    add('link',{rel:'apple-touch-icon',href:'icon-192.png'});\n    add('meta',{name:'apple-mobile-web-app-capable',content:'yes'});\n    add('meta',{name:'mobile-web-app-capable',content:'yes'});\n  }\n  if('serviceWorker' in navigator && location.protocol==='https:'){\n    navigator.serviceWorker.register('sw.js').catch(function(){});\n  }\n})();\n<\u002Fscript><\u002Fhelmet>\n\n\n<div class=\"app-chrome\" style=\"height:100dvh;display:flex;flex-direction:column;align-items:center;background:#E9E4DC\">\n<div style=\"width:100%;max-width:480px;flex:1;min-height:0;display:flex;flex-direction:column;background:#FAF8F6;box-shadow:0 0 40px rgba(0,0,0,.12)\">\n\n<sc-if value=\"{{ vHome }}\" hint-placeholder-val=\"{{ true }}\">\n<div style=\"flex:1;min-height:0;display:flex;flex-direction:column\">\n  <sc-if value=\"{{ tabVisits }}\" hint-placeholder-val=\"{{ true }}\">\n  <div style=\"flex:1;min-height:0;display:flex;flex-direction:column\">\n    <div style=\"padding:18px 20px 12px;display:flex;align-items:center;justify-content:space-between\">\n      <img src=\"ec1f74b6-b780-4866-aea6-c9c66ff11ec9\" alt=\"Episode\" style=\"height:25px;width:auto;display:block\">\n      <div style=\"width:34px;height:34px;border-radius:99px;background:#1A1A1A;color:#fff;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600\">JV<\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"padding:2px 20px 0\">\n      <div style=\"font-size:30px;font-weight:600;letter-spacing:-.02em;line-height:1.1\">Visit notes<\u002Fdiv>\n      <div style=\"font-family:'Bodoni Moda',Georgia,serif;font-style:italic;font-size:14px;color:#E73D61;margin-top:4px\">Nothing new. Still iconic.<\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"display:flex;gap:10px;padding:18px 20px 0\">\n      <div style=\"flex:1;background:#fff;border:1px solid rgba(0,0,0,.08);border-radius:14px;padding:12px 14px\">\n        <div style=\"font-size:9.5px;letter-spacing:.09em;text-transform:uppercase;color:#6B6B6B\">Open actions<\u002Fdiv>\n        <div style=\"font-size:24px;font-weight:600;margin-top:2px\">{{ statActions }}<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"flex:1;background:#fff;border:1px solid rgba(0,0,0,.08);border-radius:14px;padding:12px 14px\">\n        <div style=\"font-size:9.5px;letter-spacing:.09em;text-transform:uppercase;color:#6B6B6B\">Visits<\u002Fdiv>\n        <div style=\"font-size:24px;font-weight:600;margin-top:2px\">{{ statVisits }}<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"flex:1;background:#fff;border:1px solid rgba(0,0,0,.08);border-radius:14px;padding:12px 14px\">\n        <div style=\"font-size:9.5px;letter-spacing:.09em;text-transform:uppercase;color:#6B6B6B\">Urgent<\u002Fdiv>\n        <div style=\"font-size:24px;font-weight:600;margin-top:2px;color:#E73D61\">{{ statUrgent }}<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"noscroll\" style=\"flex:1;min-height:0;overflow:auto;padding:22px 20px 0\">\n      <div style=\"display:flex;align-items:center;gap:10px;margin-bottom:10px\">\n        <div style=\"flex:1;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:#6B6B6B\">Your visits<\u002Fdiv>\n        <div sc-camel-on-click=\"{{ exportData }}\" style=\"font-size:11.5px;font-weight:600;color:#4A4A4A;cursor:pointer\" style-hover=\"color:#E73D61\">Export<\u002Fdiv>\n        <div sc-camel-on-click=\"{{ pickImport }}\" style=\"font-size:11.5px;font-weight:600;color:#4A4A4A;cursor:pointer\" style-hover=\"color:#E73D61\">Import<\u002Fdiv>\n        <input type=\"file\" accept=\"application/json,.json\" ref=\"{{ importRef }}\" sc-camel-on-change=\"{{ onImport }}\" style=\"display:none\">\n      <\u002Fdiv>\n      <sc-if value=\"{{ hasToast }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"background:#1A1A1A;color:#fff;border-radius:12px;padding:10px 13px;font-size:12.5px;margin-bottom:10px\">{{ toast }}<\u002Fdiv>\n      <\u002Fsc-if>\n      <div style=\"display:flex;flex-direction:column;gap:10px\">\n        <sc-for list=\"{{ visits }}\" as=\"v\" hint-placeholder-count=\"2\">\n          <div sc-camel-on-click=\"{{ v.open }}\" style=\"background:#fff;border:1px solid rgba(0,0,0,.08);border-radius:16px;padding:14px;cursor:pointer\" style-hover=\"border-color:rgba(231,61,97,.5)\">\n            <div style=\"display:flex;align-items:center;justify-content:space-between;gap:8px\">\n              <div style=\"font-size:15px;font-weight:600\">{{ v.store }}<\u002Fdiv>\n              <div style=\"{{ v.badgeStyle }}\">{{ v.badge }}<\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"font-size:12px;color:#6B6B6B;margin-top:4px\">{{ v.meta }}<\u002Fdiv>\n            <div style=\"display:flex;align-items:center;gap:6px;margin-top:11px\">\n              <sc-for list=\"{{ v.dots }}\" as=\"d\" hint-placeholder-count=\"9\">\n                <div style=\"{{ d.style }}\"><\u002Fdiv>\n              <\u002Fsc-for>\n              <div style=\"flex:1\"><\u002Fdiv>\n              <div style=\"font-size:11.5px;color:#6B6B6B\">{{ v.right }}<\u002Fdiv>\n              <div sc-camel-on-click=\"{{ v.remove }}\" style=\"{{ v.deleteStyle }}\" style-hover=\"color:#B01F41\">{{ v.deleteLabel }}<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n        <sc-if value=\"{{ noVisits }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"border:1px dashed rgba(0,0,0,.16);border-radius:16px;padding:26px 16px;text-align:center;color:#4A4A4A;font-size:13px;line-height:1.5\">No visits yet.<br>Start one and everything you note is saved on this device.<\u002Fdiv>\n        <\u002Fsc-if>\n      <\u002Fdiv>\n      <div style=\"height:14px\"><\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"padding:14px 20px 12px;border-top:1px solid rgba(0,0,0,.07)\">\n      <div sc-camel-on-click=\"{{ goNew }}\" style=\"background:#E73D61;color:#fff;border-radius:16px;height:54px;display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:600;cursor:pointer;box-shadow:0 8px 20px rgba(231,61,97,.28)\" style-hover=\"background:#C9264A\">Start a visit<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <sc-if value=\"{{ tabTemplates }}\" hint-placeholder-val=\"{{ false }}\">\n  <div style=\"flex:1;min-height:0;display:flex;flex-direction:column\">\n    <div style=\"padding:20px 20px 0\">\n      <div style=\"font-size:26px;font-weight:600;letter-spacing:-.02em\">Templates<\u002Fdiv>\n      <div style=\"font-size:12.5px;color:#4A4A4A;margin-top:5px;line-height:1.45\">What a walkthrough asks you to look at. Tap one to start a visit with it.<\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"noscroll\" style=\"flex:1;min-height:0;overflow:auto;padding:18px 20px 0;display:flex;flex-direction:column;gap:10px\">\n      <sc-for list=\"{{ templateCards }}\" as=\"t\" hint-placeholder-count=\"3\">\n        <div sc-camel-on-click=\"{{ t.pick }}\" style=\"{{ t.style }}\" style-hover=\"border-color:rgba(231,61,97,.5)\">\n          <div style=\"display:flex;align-items:center;gap:8px\">\n            <div style=\"flex:1;font-size:15.5px;font-weight:600\">{{ t.name }}<\u002Fdiv>\n            <div style=\"font-size:10px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:#E73D61\">{{ t.inUse }}<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"font-size:12px;color:#4A4A4A;margin-top:3px\">{{ t.desc }}<\u002Fdiv>\n          <div style=\"display:flex;flex-wrap:wrap;gap:5px;margin-top:11px\">\n            <sc-for list=\"{{ t.chips }}\" as=\"c\" hint-placeholder-count=\"4\">\n              <div style=\"font-size:11px;font-weight:500;padding:4px 8px;border-radius:99px;background:#F2EFEA;color:#3A3A3A\">{{ c.label }}<\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n      <div style=\"height:14px\"><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <sc-if value=\"{{ tabSearch }}\" hint-placeholder-val=\"{{ false }}\">\n  <div style=\"flex:1;min-height:0;display:flex;flex-direction:column\">\n    <div style=\"padding:20px 20px 0\">\n      <div style=\"font-size:26px;font-weight:600;letter-spacing:-.02em\">Search notes<\u002Fdiv>\n      <input value=\"{{ query }}\" sc-camel-on-change=\"{{ onQuery }}\" placeholder=\"Extinguisher, soap, Spuistraat…\" style=\"width:100%;box-sizing:border-box;margin-top:12px;border:1px solid rgba(0,0,0,.12);background:#fff;border-radius:13px;padding:13px;font-size:14px;outline:none\">\n      <div class=\"noscroll\" style=\"display:flex;gap:6px;overflow-x:auto;padding:11px 0 0\">\n        <sc-for list=\"{{ searchFilters }}\" as=\"f\" hint-placeholder-count=\"4\">\n          <div sc-camel-on-click=\"{{ f.pick }}\" style=\"{{ f.style }}\">{{ f.label }}<\u002Fdiv>\n        <\u002Fsc-for>\n nt-placeholder-count=\"0\">\n        <div style=\"background:#fff;border:1px solid rgba(0,0,0,.08);border-radius:14px;padding:12px 13px\">\n          <div style=\"display:flex;align-items:center;gap:7px\">\n            <div style=\"{{ n.kindStyle }}\">{{ n.kind }}<\u002Fdiv>\n            <div style=\"font-size:10.5px;color:#6B6B6B\">{{ n.time }}<\u002Fdiv>\n            <div style=\"flex:1\"><\u002Fdiv>\n            <div sc-camel-on-click=\"{{ n.remove }}\" style=\"font-size:16px;color:#8A8A8A;line-height:1;padding:0 3px;cursor:pointer\" style-hover=\"color:#E73D61\">×<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"font-size:14px;line-height:1.42;margin-top:7px;text-wrap:pretty\">{{ n.text }}<\u002Fdiv>\n          <sc-if value=\"{{ n.hasPhoto }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"{{ n.photoStyle }}\"><\u002Fdiv>\n          <\u002Fsc-if>\n          <sc-if value=\"{{ n.hasAudio }}\" hint-placeholder-val=\"{{ false }}\">\n            <div sc-camel-on-click=\"{{ n.play }}\" style=\"display:flex;align-items:center;gap:9px;margin-top:9px;padding:9px 11px;border-radius:11px;background:#F2EFEA;cursor:pointer\" style-hover=\"background:#E9E4DC\">\n              <div style=\"width:22px;height:22px;border-radius:99px;background:#E73D61;color:#fff;display:flex;align-items:center;justify-content:center;font-size:10px\">▶<\u002Fdiv>\n              <div style=\"font-size:12.5px;font-weight:600;color:#1A1A1A\">Play recording<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n          <sc-if value=\"{{ n.hasOwner }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"display:flex;align-items:center;gap:8px;margin-top:9px;padding-top:9px;border-top:1px solid rgba(0,0,0,.06)\">\n              <div style=\"font-size:11.5px;font-weight:600\">{{ n.owner }}<\u002Fdiv>\n              <div style=\"font-size:11.5px;color:#C9264A;font-weight:600\">{{ n.due }}<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n      <sc-if value=\"{{ noNotes }}\" hint-placeholder-val=\"{{ true }}\">\n        <div style=\"border:1px dashed rgba(0,0,0,.14);border-radius:14px;padding:22px 14px;text-align:center;color:#4A4A4A;font-size:12.5px;line-height:1.5\">Nothing noted here yet.<br>Type it, photograph it, or dictate it.<\u002Fdiv>\n      <\u002Fsc-if>\n    <\u002Fdiv>\n    <div style=\"height:14px\"><\u002Fdiv>\n  <\u002Fdiv>\n\n  <div style=\"background:#fff;border-top:1px solid rgba(0,0,0,.08);padding:11px 16px 14px\">\n    <sc-if value=\"{{ recording }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"display:flex;align-items:center;gap:10px;background:#1A1A1A;color:#fff;border-radius:14px;padding:13px 14px\">\n        <div style=\"width:9px;height:9px;border-radius:99px;background:#E73D61\"><\u002Fdiv>\n        <div style=\"flex:1;font-size:13px\">{{ recordingText }}<\u002Fdiv>\n        <div sc-camel-on-click=\"{{ stopRecording }}\" style=\"font-size:12px;font-weight:600;color:#E73D61;cursor:pointer\">Stop<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n    <sc-if value=\"{{ notRecording }}\" hint-placeholder-val=\"{{ true }}\">\n      <div>\n        <div style=\"display:flex;gap:6px;margin-bottom:9px;align-items:center\">\n          <sc-for list=\"{{ kinds }}\" as=\"k\" hint-placeholder-count=\"2\">\n            <div sc-camel-on-click=\"{{ k.pick }}\" style=\"{{ k.style }}\">{{ k.label }}<\u002Fdiv>\n          <\u002Fsc-for>\n          <div style=\"flex:1\"><\u002Fdiv>\n          <div sc-camel-on-click=\"{{ takePhoto }}\" style=\"display:flex;align-items:center;gap:5px;padding:6px 10px;border-radius:99px;font-size:11.5px;font-weight:600;background:#F2EFEA;color:#1A1A1A;cursor:pointer\" style-hover=\"background:#E9E4DC\"><span style=\"font-size:12px\">◉<\u002Fspan>Camera<\u002Fdiv>\n          <div sc-camel-on-click=\"{{ pickPhoto }}\" style=\"padding:6px 10px;border-radius:99px;font-size:11.5px;font-weight:600;background:#F2EFEA;color:#1A1A1A;cursor:pointer\" style-hover=\"background:#E9E4DC\">Library<\u002Fdiv>\n          <div sc-camel-on-click=\"{{ startRecording }}\" style=\"padding:6px 10px;border-radius:99px;font-size:11.5px;font-weight:600;background:#F2EFEA;color:#1A1A1A;cursor:pointer\" style-hover=\"background:#E9E4DC\">Voice<\u002Fdiv>\n        <\u002Fdiv>\n        <sc-if value=\"{{ isAction }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"display:flex;gap:6px;margin-bottom:9px\">\n            <input value=\"{{ owner }}\" sc-camel-on-change=\"{{ onOwner }}\" placeholder=\"Owner\" style=\"flex:1;min-width:0;border:1px solid rgba(0,0,0,.12);background:#FAF8F6;border-radius:11px;padding:10px 11px;font-size:13px;outline:none\">\n            <input value=\"{{ due }}\" sc-camel-on-change=\"{{ onDue }}\" placeholder=\"Due (e.g. 24 Sept)\" style=\"flex:1;min-width:0;border:1px solid rgba(0,0,0,.12);background:#FAF8F6;border-radius:11px;padding:10px 11px;font-size:13px;outline:none\">\n          <\u002Fdiv>\n        <\u002Fsc-if>\n        <div style=\"display:flex;align-items:flex-end;gap:9px\">\n          <textarea value=\"{{ draft }}\" sc-camel-on-change=\"{{ onDraft }}\" sc-camel-on-key-down=\"{{ onKey }}\" placeholder=\"{{ placeholder }}\" rows=\"1\" style=\"flex:1;min-width:0;resize:none;border:1px solid rgba(0,0,0,.12);background:#FAF8F6;border-radius:13px;padding:13px;font-size:14px;line-height:1.35;outline:none;max-height:120px\"><\u002Ftextarea>\n          <div sc-camel-on-click=\"{{ addNote }}\" style=\"width:46px;height:46px;flex:none;border-radius:13px;background:#E73D61;color:#fff;display:flex;align-items:center;justify-content:center;font-size:19px;font-weight:600;cursor:pointer\" style-hover=\"background:#C9264A\">↑<\u002Fdiv>\n        <\u002Fdiv>\n        <input type=\"file\" accept=\"image/*\" ref=\"{{ fileRef }}\" sc-camel-on-change=\"{{ onFile }}\" style=\"display:none\">\n        <input type=\"file\" accept=\"image/*\" capture=\"environment\" ref=\"{{ camRef }}\" sc-camel-on-change=\"{{ onFile }}\" style=\"display:none\">\n      <\u002Fdiv>\n    <\u002Fsc-if>\n  <\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<sc-if value=\"{{ vReview }}\" hint-placeholder-val=\"{{ false }}\">\n<div style=\"flex:1;min-height:0;display:flex;flex-direction:column\">\n  <div style=\"padding:16px 16px 12px;background:#fff;border-bottom:1px solid rgba(0,0,0,.07);display:flex;align-items:center;gap:10px\">\n    <div sc-camel-on-click=\"{{ goCapture }}\" style=\"font-size:13px;color:#4A4A4A;font-weight:600;cursor:pointer\">Back<\u002Fdiv>\n    <div style=\"flex:1;text-align:center;font-size:13.5px;font-weight:600\">Review visit<\u002Fdiv>\n    <div style=\"width:34px\"><\u002Fdiv>\n  <\u002Fdiv>\n  <div class=\"noscroll\" style=\"flex:1;min-height:0;overflow:auto;padding:16px 16px 0\">\n    <div style=\"background:#1A1A1A;color:#fff;border-radius:18px;padding:16px\">\n      <div style=\"font-size:9.5px;letter-spacing:.11em;text-transform:uppercase;color:rgba(255,255,255,.7)\">Visit summary<\u002Fdiv>\n      <div style=\"font-size:19px;font-weight:600;margin-top:5px\">{{ curStore }}<\u002Fdiv>\n      <div style=\"font-size:12px;color:rgba(255,255,255,.75);margin-top:2px\">{{ reviewMeta }}<\u002Fdiv>\n      <div style=\"display:flex;gap:5px;margin-top:14px\">\n        <sc-for list=\"{{ sections }}\" as=\"s\" hint-placeholder-count=\"9\">\n          <div style=\"{{ s.barStyle }}\"><\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n      <div style=\"display:flex;gap:14px;margin-top:11px;font-size:11px;color:rgba(255,255,255,.75)\">\n        <div>{{ countOk }} ok<\u002Fdiv><div>{{ countAtt }} attention<\u002Fdiv><div>{{ countUrg }} urgent<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"display:flex;align-items:baseline;justify-content:space-between;margin:20px 0 9px\">\n      <div style=\"font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:#6B6B6B\">Report text<\u002Fdiv>\n      <div sc-camel-on-click=\"{{ rewrit }}\">{{ s.statusLabel }}<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"font-size:9.5pt;line-height:1.55;color:#4A4A4A;margin-top:6pt;text-wrap:pretty\">{{ s.lead }}<\u002Fdiv>\n        <sc-for list=\"{{ s.notes }}\" as=\"n\" hint-placeholder-count=\"0\">\n          <div style=\"margin-top:8pt;break-inside:avoid\">\n            <div style=\"font-size:6.5pt;letter-spacing:.12em;text-transform:uppercase;color:#8A8A8A\">{{ n.meta }}<\u002Fdiv>\n            <div style=\"font-size:10pt;line-height:1.55;margin-top:2pt;text-wrap:pretty\">{{ n.text }}<\u002Fdiv>\n            <sc-if value=\"{{ n.hasPhoto }}\" hint-placeholder-val=\"{{ false }}\">\n              <div style=\"{{ n.photoStylePrint }}\"><\u002Fdiv>\n              <div style=\"font-size:6.5pt;letter-spacing:.1em;text-transform:uppercase;color:#8A8A8A;margin-top:2.5pt\">{{ n.photoCaption }}<\u002Fdiv>\n            <\u002Fsc-if>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fsc-for>\n\n    <sc-if value=\"{{ hasActions }}\" hint-placeholder-val=\"{{ true }}\">\n    <div style=\"margin-top:22pt;break-inside:avoid\">\n      <div style=\"font-size:7pt;letter-spacing:.18em;text-transform:uppercase;color:#6B6B6B\">Agreed actions<\u002Fdiv>\n      <div style=\"display:flex;gap:8pt;padding:5pt 0 4pt;border-bottom:1.4pt solid #1A1A1A;margin-top:5pt;font-size:6.5pt;letter-spacing:.12em;text-transform:uppercase;color:#6B6B6B\">\n        <div style=\"width:14pt;flex:none\">#<\u002Fdiv>\n        <div style=\"flex:1\">Action<\u002Fdiv>\n        <div style=\"width:80pt;flex:none\">Owner<\u002Fdiv>\n        <div style=\"width:58pt;flex:none;text-align:right\">Due<\u002Fdiv>\n      <\u002Fdiv>\n      <sc-for list=\"{{ printActions }}\" as=\"a\" hint-placeholder-count=\"2\">\n        <div style=\"display:flex;gap:8pt;padding:5.5pt 0;border-bottom:1px solid rgba(0,0,0,.1);font-size:9.5pt;line-height:1.45;break-inside:avoid\">\n          <div style=\"width:14pt;flex:none;color:#8A8A8A\">{{ a.num }
